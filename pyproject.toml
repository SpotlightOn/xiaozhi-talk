[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaozhi-talk"
version = "1.0.0"
description = "Desktop chat client for Xiaozhi servers, built with PySide6 and xiaozhi-sdk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "xiaozhi-talk contributors" }]
# PyPI and its consumers read the supported interpreters from these
# classifiers, not from requires-python.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio",
]
# 6.12.0 aborts on Python <= 3.11: it over-decrements the refcount of immortal
# objects such as None and True, which those interpreters still free
# (PYSIDE-3474, fixed in 6.12.1). Python 3.12+ keeps 6.12; older interpreters
# stay on 6.11 until 6.12.1 is out. The PySide6 meta package pulls in
# pyside6-addons, which is where Qt Multimedia lives.
dependencies = [
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.12,<6.13; python_version >= '3.12'",
    "xiaozhi-sdk>=0.5.1",
    "cryptography>=41",
]

[project.optional-dependencies]
# Enables the operating system keyring as credential storage. secretstorage is
# the Secret Service bridge and only exists on Linux; Windows and macOS keyring
# backends ship with keyring itself.
keyring = ["keyring>=24", "secretstorage>=3.3; sys_platform == 'linux'"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
xiaozhi-talk = "xiaozhi_talk.app:main"

[project.urls]
Homepage = "https://github.com/SpotlightOn/xiaozhi-talk"
Repository = "https://github.com/SpotlightOn/xiaozhi-talk"
Issues = "https://github.com/SpotlightOn/xiaozhi-talk/issues"
Changelog = "https://github.com/SpotlightOn/xiaozhi-talk/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["xiaozhi_talk"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

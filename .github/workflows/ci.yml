name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Qt Multimedia and the offscreen platform need a set of system libraries
      # even though the test suite never opens a window.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1 \
            libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libpango-1.0-0 libcairo2 libxkbcommon-x11-0 \
            libpulse0 libpulse-mainloop-glib0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml
        env:
          QT_QPA_PLATFORM: offscreen

      # Public repository: Codecov takes the token from GitHub OIDC.
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
